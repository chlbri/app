name: Publish
on:
  push:
    branches:
      - beta
      - canary
      - main
      - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pnpm repo
        uses: chlbri/node-github-actions/.github/actions/pnpmi@main

      - name: Setup Void Zero
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24
          # Default is true, set explicitly: this installs the workspace with
          # the managed pnpm, which the publish action below relies on.
          run-install: true

      # Restore only. ci-vp.yml is the single writer of this cache: a publisher
      # running on a tag/release ref can only ever write a cache scoped to that
      # ref, which no other run can read. Same key scheme as ci-vp so the exact
      # entry saved by CI in this run is reused when it already exists, and the
      # prefix falls back to the newest entry of the branch/default branch.
      - name: Restore Vite Task cache
        id: vite-task-cache
        uses: actions/cache/restore@v6

        with:
          path: node_modules/.vite/task-cache
          key:
            ${{ runner.os }}-${{ runner.arch }}-vite-tasks-${{ github.ref }}-${{
            hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-vite-tasks-${{ github.ref }}

      - name: Build
        run: vp run pretest

      # Only save on a miss: an exact hit means the entry already exists, and
      # cache/save@v6 fails the job when the key is already reserved.
      - name: Save Vite Task cache
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/task-cache
          key:
            ${{ runner.os }}-${{ runner.arch }}-vite-tasks-${{ github.ref }}-${{
            hashFiles('**/pnpm-lock.yaml') }}

      - name: Upload workspace
        uses: actions/upload-artifact@v7

        with:
          name: built-workspace

          # Only the generated `lib` folders are consumed by the publish jobs.
          # The previous `**/lib/**` pattern also matched every `lib` folder
          # nested in node_modules (~1.2 GB and ~44k files), which made this
          # step the slowest one of the run. `!node_modules` only excludes the
          # root folder, not the per-package ones created by
          # `hoistingLimits: workspaces`.
          #
          # The leading `**/` is required: the artifact root directory is the
          # least common ancestor of the search paths, i.e. the literal part
          # before the first wildcard. With `packages/*/lib/**` that root is
          # `packages`, so the archive stores `app/lib/index.js` instead of
          # `packages/app/lib/index.js` and the publish jobs (which download
          # into the repo root) would never find the build output.
          #
          # Bundled workspace deps are linked, not injected, so their `lib`
          # folders live in the workspace: packing follows the symlink and
          # `**/packages/*/lib/**` misses `packages/utils/bemedev` (used by
          # @bemedev/app-options). Restore it too or the published tarball
          # would embed a `lib`-less copy of the bundled dep.
          path: |
            **/packages/*/lib/**
            packages/utils/*/lib/**

          if-no-files-found: error
          retention-days: 1

  app:
    needs: [build]
    uses: chlbri/node-github-actions/.github/workflows/publish-vp.yml@main
    secrets: inherit

    with:
      type:
        ${{ github.ref_name == 'beta' && 'beta' || github.ref_name == 'canary' &&
        'canary' || 'latest' }}

      package: ./packages/app
      artifact: built-workspace

  vitest:
    needs: [build]
    uses: chlbri/node-github-actions/.github/workflows/publish-vp.yml@main
    secrets: inherit

    with:
      type:
        ${{ github.ref_name == 'beta' && 'beta' || github.ref_name == 'canary' &&
        'canary' || 'latest' }}

      package: ./packages/vitest
      artifact: built-workspace

  solidjs:
    needs: [build]
    uses: chlbri/node-github-actions/.github/workflows/publish-vp.yml@main
    secrets: inherit

    with:
      type:
        ${{ github.ref_name == 'beta' && 'beta' || github.ref_name == 'canary' &&
        'canary' || 'latest' }}

      package: ./packages/solidjs
      artifact: built-workspace

  reactjs:
    needs: [build]
    uses: chlbri/node-github-actions/.github/workflows/publish-vp.yml@main
    secrets: inherit

    with:
      type:
        ${{ github.ref_name == 'beta' && 'beta' || github.ref_name == 'canary' &&
        'canary' || 'latest' }}

      package: ./packages/reactjs
      artifact: built-workspace

  cli:
    needs: [build]
    uses: chlbri/node-github-actions/.github/workflows/publish-vp.yml@main
    secrets: inherit

    with:
      type:
        ${{ github.ref_name == 'beta' && 'beta' || github.ref_name == 'canary' &&
        'canary' || 'latest' }}

      package: ./packages/cli
      artifact: built-workspace

  valibot:
    needs: [build]
    uses: chlbri/node-github-actions/.github/workflows/publish-vp.yml@main
    secrets: inherit

    with:
      type:
        ${{ github.ref_name == 'beta' && 'beta' || github.ref_name == 'canary' &&
        'canary' || 'latest' }}

      package: ./packages/valibot
      artifact: built-workspace

  contract:
    needs: [build]
    uses: chlbri/node-github-actions/.github/workflows/publish-vp.yml@main
    secrets: inherit

    with:
      type:
        ${{ github.ref_name == 'beta' && 'beta' || github.ref_name == 'canary' &&
        'canary' || 'latest' }}

      package: ./packages/contract
      artifact: built-workspace

  options:
    needs: [build]
    uses: chlbri/node-github-actions/.github/workflows/publish-vp.yml@main
    secrets: inherit

    with:
      type:
        ${{ github.ref_name == 'beta' && 'beta' || github.ref_name == 'canary' &&
        'canary' || 'latest' }}

      package: ./packages/options
      artifact: built-workspace

  cleanup:
    name: Cleanup Artifacts
    runs-on: ubuntu-latest
    needs: [build, app, vitest, solidjs, reactjs, cli, valibot, contract]
    if: always()

    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete artifacts
        uses: actions/github-script@v9

        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
              });

              for (const artifact of artifacts.data.artifacts) {
                if (artifact.name === 'built-workspace') {
                  console.log(`Deleting artifact: ${artifact.name} (ID: ${artifact.id})`);
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id,
                  });
                  console.log(`Successfully deleted artifact: ${artifact.name}`);
                }
              }
            } catch (error) {
              console.log(`Error during cleanup: ${error.message}`);
            }

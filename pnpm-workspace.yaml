packages:
  - 'packages/app'
  - 'packages/contract'
  - 'packages/options'
  - 'packages/valibot'
  - 'packages/vitest'
  - 'packages/__tests__/*'
  - 'packages/solidjs'
  - 'packages/reactjs'
  - 'packages/utils/bemedev'
  - 'packages/cli'
  - 'packages/interval3'
  - 'packages/plugins/core'
  - 'packages/plugins/bemedev'
  - 'apps/*'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true

# Workspace deps that are bundled into a published package stay linked (not
# injected): an injected dep is a hardlink snapshot taken at install time, so a
# fresh CI install would snapshot a `lib`-less copy and every runtime import of
# the package would fail during the build. `pnpm pack` follows the symlink and
# still bundles the dep's files into the tarball.
nodeLinker: hoisted

minimumReleaseAge: 300

minimumReleaseAgeExclude:
  - '@bemedev/*'
  - vite-plus
  - '@voidzero-dev/*'
  - oxlint
  - '@oxlint/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - oxfmt
  - '@oxfmt/*'
  - vitest
  - '@vitest/*'

overrides:
  typescript: 'catalog:'

catalog:
  # Bemedev packages
  '@bemedev/better-promise': '^0.1.1'
  '@bemedev/better-set': '^0.2.1'
  '@bemedev/boolean-recursive': '^0.0.3'
  '@bemedev/decompose': '^2.3.0'
  '@bemedev/dev-utils': '^1.6.2'
  '@bemedev/function-swap': '^0.2.5'
  '@bemedev/hook-wrapper': '^1.0.0'
  '@bemedev/interval2': '^1.2.1'
  '@bemedev/pipe': '^1.6.1'
  '@bemedev/react-sync': '^0.1.1'
  '@bemedev/rx-pausable': '^1.2.0'
  '@bemedev/scheduler': '^1.2.1'
  '@bemedev/sequence': '^1.0.0'
  '@bemedev/sleep': '^0.2.2'
  '@bemedev/typings': '^1.5.0'

  # Types
  '@types/clone-deep': '^4.0.4'
  '@types/node': ^26.6.11
  '@types/react': '^19.3.3'
  '@types/react-dom': '^19.3.0'

  # Build, lint and test tooling
  '@size-limit/file': '^14.3.0'
  '@vitest/coverage-v8': 5.1.1
  '@vitest/ui': 5.1.1
  glob: '^14.0.6'
  globals: '^17.14.0'
  husky: '^9.1.7'
  onchange: '^7.1.0'
  prettier: '^3.10.1'
  pretty-quick: '^4.2.2'
  rimraf: '^6.1.4'
  size-limit: '^14.3.0'
  tslib: '^2.9.1'
  tsx: '^4.23.15'
  typescript: '6.0.3'
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vite-plus: 1.8.0
  vitest: 5.1.2
  zx: '^8.8.5'

  # Source dependencies
  add: '^2.0.9'
  cmd-ts: '^0.15.0'
  fast-deep-equal: '^3.1.3'
  fast-glob: '^3.3.3'
  is-online: '^12.0.2'
  node-watch: '^0.7.4'
  rxjs: '^7.8.2'
  ts-morph: '^28.0.0'
  valibot: '^1.4.2'

  # Apps
  '@faker-js/faker': '^10.6.0'
  '@solid-primitives/storage': '^5.0.0'
  '@tailwindcss/typography': '^0.5.20'
  '@tailwindcss/vite': '^4.3.5'
  '@tanstack/devtools-vite': latest
  '@tanstack/react-devtools': latest
  '@tanstack/react-router': latest
  '@tanstack/react-router-devtools': latest
  '@tanstack/react-start': latest
  '@tanstack/router-cli': '^1.168.0'
  '@tanstack/solid-router': 1.170.43
  '@tanstack/solid-router-devtools': 1.167.4
  '@tanstack/solid-start': 1.169.7
  '@vitejs/plugin-react': '^6.3.0'
  class-variance-authority: '^0.7.1'
  clsx: '^2.1.1'
  cn: '^0.5.2'
  jsdom: '^31.0.1'
  lucide-react: '^1.80.0'

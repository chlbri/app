packages:
  - 'packages/app'
  - 'packages/contract'
  - 'packages/options'
  - 'packages/valibot'
  - 'packages/vitest'
  - 'packages/__tests__/*'
  - 'packages/solidjs'
  - 'packages/reactjs'
  - 'packages/utils/bemedev'
  - 'packages/cli'
  - 'apps/*'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true

# bundleDependencies needs a real, in-package copy of the injected workspace dep.
nodeLinker: hoisted
dedupeInjectedDeps: false
hoistingLimits: workspaces

# Injected deps are hardlink snapshots: refresh them after a build so that
# dependent packages resolve freshly generated lib/ outputs in CI.
syncInjectedDepsAfterScripts:
  - build

minimumReleaseAge: 300

minimumReleaseAgeExclude:
  - '@bemedev/*'
  - vite-plus
  - '@voidzero-dev/*'
  - oxlint
  - '@oxlint/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - oxfmt
  - '@oxfmt/*'
  - vitest
  - '@vitest/*'

overrides:
  typescript: 6.0.3
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vitest: 5.1.0
  vite-plus: 1.6.0
  '@vitest/coverage-v8': 5.1.0
  '@vitest/ui': 5.1.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
permissions:
  '@tanstack/devtools-vite':
    skills: true
  '@tanstack/react-router':
    skills: [router-query, migrate-from-react-router, react-router]
  '@tanstack/react-start':
    skills: [migrate-from-nextjs, react-start]
  '@tanstack/solid-router':
    skills: true
  '@tanstack/solid-start':
    skills: true
skills:
  dirs:
    - .agent/skills
    - .agents/skills
    - .claude/skills
    - .cursor/skills
    - .gemini/skills
    - .github/skills

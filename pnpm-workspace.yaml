  '@testing-library/jest-dom': '^8.0.0'
  '@testing-library/react': '^16.3.3'
  '@testing-library/user-event': '^14.6.13'

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
permissions:
  '@tanstack/devtools-vite':
    skills: true
  '@tanstack/react-router':
    skills: [router-query, migrate-from-react-router, react-router]
  '@tanstack/react-start':
    skills: [migrate-from-nextjs, react-start]
  '@tanstack/solid-router':
    skills: true
  '@tanstack/solid-start':
    skills: true
skills:
  dirs:
    - .agents/skills
